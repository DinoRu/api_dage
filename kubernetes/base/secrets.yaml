apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: meter-reading
type: Opaque
stringData:
  # Database
  DB_USER: "postgres"
  DB_PASS: "CHANGE_ME_IN_PRODUCTION"
  
  # Application
  SECRET_KEY: "GENERATE_STRONG_KEY_HERE"
  
  # Redis
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  
  # S3
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_IN_PRODUCTION"
  
  # First Superuser
  FIRST_SUPERUSER_USERNAME: "admin"
  FIRST_SUPERUSER_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  FIRST_SUPERUSER_FULL_NAME: "System Administrator"