apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: meter-reading
data:
  # Application
  APP_NAME: "Meter Reading API"
  APP_VERSION: "1.0.0"
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  
  # Database
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "meter_readings"
  DB_POOL_SIZE: "20"
  DB_MAX_OVERFLOW: "40"
  
  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_ENABLED: "true"
  
  # S3/MinIO
  S3_ENABLED: "true"
  S3_ENDPOINT_URL: "http://minio-service:9000"
  AWS_REGION: "us-east-1"
  S3_BUCKET_NAME: "meter-readings"
  
  # Geolocation
  GEOLOCATION_REQUIRED: "true"
  GEOLOCATION_STRICT_VALIDATION: "false"
  GEOLOCATION_MAX_DISTANCE: "500"
  
  # API
  API_V1_PREFIX: "/api/v1"
  BACKEND_CORS_ORIGINS: "https://app.yourdomain.com,https://yourdomain.com"
  
  # Rate Limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_PER_MINUTE: "100"